<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contacto</title>
</head>

<body>
    <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
    <header class="navbar">
        <div class="contenedor nav-contenido">
            <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="#productos">Productos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <div class="encabezado-principal">
            <h1>Sistema de Mensajería</h1>
            <p>¿Tienes algunas duda?, dejanos un mensaje y te responderemos</p>
        </div>


        <div class="panel-tienda">
            <!-- SECCIÓN 3: Formulario de mensajes -->
            <section class="tarjeta" id="registro">
                <h2 id="tituloFormulario">Envíanos un Mensaje</h2>

                <form id="formularioContacto">
                    <!-- Campo oculto para almacenar el ID en caso de edición -->
                    <input type="hidden" id="mensajeId" value="" />
                    <input type="hidden" id="fechaHora" value="" />

                    <div class="campo">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombreCompleto" placeholder="Ej: Laura Ladino" required />

                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" placeholder="Ej: nombre@correo.com" required />
                    </div>

                    <div class="campo">
                        <label for="asunto">Asunto:</label>
                        <input type="text" id="asunto" placeholder="Escribe tu asunto aquí..." required />
                    </div>

                    <div class="campo">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" rows="6" placeholder="Escribe tu mensaje detallado aquí..."
                            required></textarea>
                    </div>

                    <div class="acciones-form">
                        <button type="submit" id="btnGuardar" class="btn btn-guardar">Enviar Mensaje</button>
                    </div>
                </form>
            </section>

            <!-- SECCIÓN 4: Lista de Mensajes -->
            <section class="tarjeta" id="mensajes">
                <h2>Lista de Mensajes</h2>
                <div id="listaMensajes" class="lista-ms">
                    <!-- Los mensajes se cargan desde app.js -->
                </div>
            </section>
        </div>
    </main>
    <script src="app.js"></script>
</body>

</html>
